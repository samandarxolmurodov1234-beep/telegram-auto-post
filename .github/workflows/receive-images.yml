name: Receive Images From Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  receive:
    runs-on: ubuntu-latest
    steps:
      - name: Repository'ni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install requests

      - name: Yangi rasmlarni qabul qilish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_USER_ID: ${{ secrets.ALLOWED_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python receive_images.py

      - name: O'zgarishlarni saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/ pending/ updates_state.json pending_state.json
          git diff --staged --quiet || git commit -m "Yangi rasm(lar) qayta ishlandi"
          git push
