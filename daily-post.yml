name: Daily Telegram Post

on:
  schedule:
    # Har kuni soat 08:00 (Toshkent vaqti, UTC+5) = 03:00 UTC da ishga tushadi
    # Vaqtni o'zgartirmoqchi bo'lsangiz, quyidagi qatorni tahrirlang (UTC bo'yicha)
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # Bu qator "Run workflow" tugmasi bilan qo'lda ham ishga tushirish imkonini beradi

permissions:
  contents: write  # state.json faylini qayta commit qilish uchun kerak

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Repository'ni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install requests

      - name: Postni yuborish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python post_to_telegram.py

      - name: Holatni (state.json) qayta saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Post holati yangilandi: $(date -u +'%Y-%m-%d')"
          git push
